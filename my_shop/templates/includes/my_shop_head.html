<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="{{ shop_name }}">
<link rel="apple-touch-icon" href="/assets/my_shop/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/my_shop/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
<link rel="stylesheet" href="/assets/my_shop/css/shop.css?v={{ build_version }}">
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
  window.addEventListener("DOMContentLoaded", () => {
    const banner = document.getElementById("ms-offline");
    const sync = () => { if (banner) banner.hidden = navigator.onLine; };
    window.addEventListener("online", sync);
    window.addEventListener("offline", sync);
    sync();
  });
</script>
